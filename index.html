<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COPOM Supervisores - Mesa de Operações</title>
    <style>
        :root {
            --primary-color: #1a202c; --secondary-color: #2b6cb0; 
            --bg-color: #f0f2f5; --text-color: #2d3748;
        }

        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); display: flex; height: 100vh; overflow: hidden; }

        /* TELA DE LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: white; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 320px; color: #2d3748; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background-color: #2b6cb0; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }

        /* TELA DE SELEÇÃO DE POSTO (MESA DE OPERAÇÕES) */
        #role-selection-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 32, 44, 0.98); z-index: 9998; display: none; justify-content: center; align-items: center; color: white; flex-direction: column; }
        .role-box { background: white; color: #2d3748; padding: 30px; border-radius: 12px; width: 450px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; max-height: 400px; overflow-y: auto; padding: 10px; border: 1px solid #edf2f7; border-radius: 8px; }
        .role-item { padding: 15px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; text-align: left;}
        .role-item:hover:not(.taken) { background: #ebf8ff; border-color: #3182ce; }
        .role-item.taken { background: #fff5f5; color: #c53030; border-color: #feb2b2; cursor: not-allowed; opacity: 0.7; }
        .role-item.selected { background: #3182ce; color: white; border-color: #2b6cb0; }

        /* APP E SIDEBAR */
        #app-container { display: none; width: 100%; height: 100%; }
        .sidebar { width: 260px; background-color: var(--primary-color); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #2d3748; }
        #infoPostoAtivo { display: block; background: #d69e2e; color: white; padding: 5px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 10px; text-transform: uppercase; }
        
        .menu-items { flex-grow: 1; padding: 20px 0; }
        .menu-btn { background: none; border: none; color: #a0aec0; padding: 15px 20px; text-align: left; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        .menu-btn.active { background-color: #2d3748; color: white; border-left: 5px solid #ecc94b; }

        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; background: var(--bg-color); }
        .screen { display: none; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 85vh; }
        .screen.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background: #2d3748; color: white; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-save { background: #48bb78; }
        .btn-logout { background: #e53e3e; margin-top: auto; padding: 15px; border-radius: 0;}
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color:#2b6cb0; margin-top:0;">COPOM Supervisores</h2>
            <p style="font-size:12px; color:#718096; margin-bottom:20px;">Acesso à Mesa de Operações</p>
            <input type="email" id="loginEmail" placeholder="E-mail">
            <input type="password" id="loginSenha" placeholder="Senha">
            <button onclick="fazerLogin()" style="width:100%;">Acessar Sistema</button>
            <div style="margin: 15px 0; color: #a0aec0; font-size: 10px;">OU</div>
            <button onclick="fazerLoginGoogle()" style="background:#4285F4; width:100%;">Entrar com o Google</button>
            <p id="msgErroLogin" style="color:#e53e3e; font-size:11px; display:none; margin-top:10px;">Falha na autenticação.</p>
        </div>
    </div>

    <div id="role-selection-screen">
        <div class="role-box">
            <h2 style="margin-top:0; border:none; justify-content:center;">Assumir Turno</h2>
            <p style="font-size:13px; color:#718096;">Selecione o seu Posto para filtragem de dados:</p>
            
            <div class="role-grid" id="gridPostos">
                </div>

            <div style="margin-top:20px; display:flex; gap:10px;">
                <button class="btn btn-save" style="flex:1; padding:15px;" onclick="confirmarPosto()">✅ Confirmar Entrada</button>
                <button class="btn" style="background:#718096;" onclick="fazerLogout()">Sair</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>COPOM</h2>
                <span id="infoPostoAtivo">POSTO ATIVO</span>
            </div>
            <div class="menu-items">
                <button class="menu-btn active" onclick="abrirTela('tela-siopm', this)">📻 SIOPM Inoperante</button>
                <button class="menu-btn" onclick="abrirTela('tela-ocorrencias', this)">🚨 Ocorrências</button>
                <button class="menu-btn" onclick="abrirTela('tela-mapa', this)">👮 Mapa de Força</button>
            </div>
            <button class="btn btn-logout" onclick="solicitarTrocaTurno()">🚪 Encerrar Turno</button>
        </div>

        <div class="main-content">
            <div id="tela-siopm" class="screen active">
                <h2>📻 Registro de SIOPM (Filtrado por Posto)</h2>
                <table>
                    <thead><tr><th>Data</th><th>BPM</th><th>Talão</th><th>Período</th><th>Desfecho</th><th>Status</th></tr></thead>
                    <tbody id="tabelaSiopm"></tbody>
                </table>
            </div>

            <div id="tela-ocorrencias" class="screen">
                <h2>🚨 Ocorrências do Posto</h2>
                <tbody id="tabelaOcorrencias"></tbody>
            </div>

            <div id="tela-mapa" class="screen">
                <h2>👮 Mapa de Força Regional</h2>
                <div id="containerBatalhoes"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, getDoc, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8x03EfniEJuUiPgy2OsKU5z-5t-MgpGc",
            authDomain: "controlefuncional-9ea1f.web.app",
            projectId: "controlefuncional-9ea1f",
            storageBucket: "controlefuncional-9ea1f.firebasestorage.app",
            messagingSenderId: "542560536368",
            appId: "1:542560536368:web:dee033089e03339148aaf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const dbFS = getFirestore(app);

        let userMail = "";
        let postoAtivo = "";
        let postosOcupados = {};

        const LISTA_POSTOS = ["Supervisor 190", "Supervisor Choque", ...Array.from({length: 12}, (_, i) => `Supervisor CPAM-${i+1}`)];

        // AUTH COM REDIRECIONAMENTO (Para evitar o erro de Popup em branco)
        window.fazerLogin = async () => { try { await signInWithEmailAndPassword(auth, loginEmail.value, loginSenha.value); } catch(e) { msgErroLogin.style.display='block'; } };
        window.fazerLoginGoogle = async () => { await signInWithRedirect(auth, new GoogleAuthProvider()); };
        window.fazerLogout = async () => { if(postoAtivo) await deleteDoc(doc(dbFS, "mesa_operacoes", postoAtivo)); await signOut(auth); location.reload(); };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userMail = user.email;
                login_screen.style.display = 'none';
                iniciarMonitoramentoMesa();
            } else {
                login_screen.style.display = 'flex';
                app_container.style.display = 'none';
                role_selection_screen.style.display = 'none';
            }
        });

        // MESA DE OPERAÇÕES (LÓGICA DE FILTRAGEM DO PLANO B)
        function iniciarMonitoramentoMesa() {
            onSnapshot(collection(dbFS, "mesa_operacoes"), (snap) => {
                postosOcupados = {};
                snap.docs.forEach(d => postosOcupados[d.id] = d.data().user);
                desenharPostos();
                if(!postoAtivo) role_selection_screen.style.display = 'flex';
            });
        }

        function desenharPostos() {
            const grid = gridPostos; grid.innerHTML = "";
            LISTA_POSTOS.forEach(p => {
                const ocupante = postosOcupados[p];
                const estaOutro = ocupante && ocupante !== userMail;
                const estaEu = ocupante === userMail;

                let css = "role-item";
                if(estaEu) css += " selected";
                if(estaOutro) css += " taken";

                grid.innerHTML += `
                    <div class="${css}" onclick="selecionarPosto('${p}', ${estaOutro})">
                        <span>${p}</span>
                        <small>${estaOutro ? '🚫 Ocupado' : '🟢 Disponível'}</small>
                    </div>
                `;
            });
        }

        window.selecionarPosto = (p, taken) => {
            if(taken) return alert("Este posto já está sendo operado por outro supervisor!");
            postoAtivo = p;
            desenharPostos();
        };

        window.confirmarPosto = async () => {
            if(!postoAtivo) return alert("Selecione um posto de serviço!");
            await setDoc(doc(dbFS, "mesa_operacoes", postoAtivo), { user: userMail, ts: Date.now() });
            role_selection_screen.style.display = 'none';
            app_container.style.display = 'flex';
            infoPostoAtivo.innerText = postoAtivo;
            carregarDadosOperacionais();
        };

        function carregarDadosOperacionais() {
            const dataH = new Date().toLocaleDateString('pt-BR');
            // FILTRAGEM HÍBRIDA: Mostra o que for do Posto OU o que for do E-mail (Retrocompatibilidade)
            onSnapshot(collection(dbFS, "siopm"), (snap) => {
                tabelaSiopm.innerHTML = "";
                snap.docs.forEach(doc => {
                    const d = doc.data();
                    if((d.criadoPor === postoAtivo || d.criadoPor === userMail) && (d.data === dataH || d.status === 'Aberto')) {
                        // Renderiza a linha na tabela...
                    }
                });
            });
        }

        window.solicitarTrocaTurno = () => { if(confirm("Encerrar turno e liberar posto?")) window.fazerLogout(); };

        window.abrirTela = (id, btn) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        };

    </script>
</body>
</html>
